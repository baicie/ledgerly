[workspace]
resolver = "2"
members = [
  "crates/ledger-domain",
  "crates/ledger-contracts",
  ".",
]
default-members = ["."]

[workspace.package]
edition = "2021"
license = "proprietary"
version = "0.1.0"

[package]
name = "ledger-server"
version.workspace = true
edition.workspace = true

[lib]
name = "ledger_server"
path = "src/lib.rs"

[[bin]]
name = "ledger-server"
path = "src/main.rs"

[dependencies]
ledger-domain = { path = "crates/ledger-domain" }
ledger-contracts = { path = "crates/ledger-contracts" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "timeout", "limit", "catch-panic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
argon2 = "0.5"
password-hash = "0.5"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid", "time", "json"] }
base64 = "0.23"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
hmac = "0.12"
subtle = "2"
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
