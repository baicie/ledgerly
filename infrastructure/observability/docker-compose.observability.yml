# Optional production observability stack.
#
# Enable with OBSERVABILITY_ENABLED=true and include this file with the
# production and VM compose files. All host ports bind to loopback by default.

services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: ledgerly-node-exporter
    profiles: ["observability"]
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9100/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: ledgerly-cadvisor
    profiles: ["observability"]
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${CADVISOR_PORT:-8082}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: ledgerly-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      alertmanager:
        condition: service_healthy
      cadvisor:
        condition: service_healthy
      ledger-server:
        condition: service_healthy
      node-exporter:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/backup-alerts.yml:/etc/prometheus/rules/backup-alerts.yml:ro
      - ./prometheus/host-alerts.yml:/etc/prometheus/rules/host-alerts.yml:ro
      - ./prometheus/platform-alerts.yml:/etc/prometheus/rules/platform-alerts.yml:ro
      - ledgerly_prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: ledgerly-alertmanager
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:?set ALERTMANAGER_WEBHOOK_URL}
      ALERTMANAGER_SEND_RESOLVED: ${ALERTMANAGER_SEND_RESOLVED:-true}
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/generate-config.sh:/etc/alertmanager/generate-config.sh:ro
      - ./alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - ledgerly_alertmanager:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:13.2.1
    container_name: ledgerly-grafana
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ledgerly_grafana:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  ledgerly_prometheus:
  ledgerly_alertmanager:
  ledgerly_grafana:
