name: ledgerly_client
description: Ledgerly Flutter client (local-first).
publish_to: none
version: 0.0.17+17
resolution: workspace

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
