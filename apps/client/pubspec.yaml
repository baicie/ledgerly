  ledger_sync:
    path: ../../packages/ledger_sync
  file_picker: ^12.0.0
  share_plus: ^13.3.0
  local_auth: ^3.0.2
  gbk_codec: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
