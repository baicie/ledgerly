name: Release

# Tag push: v* → GitHub Release (clients) + GHCR image
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0); empty = current SHA"
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ledgerly-server

jobs:
  client-release:
    name: Package Flutter clients
    runs-on: ubuntu-latest
    env:
      LEDGERLY_API_BASE_URL: ${{ vars.LEDGERLY_API_BASE_URL }}
      LEDGERLY_API_REQUIRE_HTTPS: ${{ vars.LEDGERLY_API_REQUIRE_HTTPS || 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve workspace
        run: dart pub get

      - name: Validate optional client API endpoint
        run: |
          require_https="${LEDGERLY_API_REQUIRE_HTTPS:-true}"
          case "$require_https" in
            true|false) ;;
            *)
              echo "LEDGERLY_API_REQUIRE_HTTPS must be true or false" >&2
              exit 1
              ;;
          esac

          if [[ -n "${LEDGERLY_API_BASE_URL:-}" ]]; then
            case "$LEDGERLY_API_BASE_URL" in
              https://*) ;;
              http://*)
                if [[ "$require_https" != false ]]; then
                  echo "LEDGERLY_API_BASE_URL must use HTTPS unless LEDGERLY_API_REQUIRE_HTTPS=false" >&2
                  exit 1
                fi
                ;;
              *)
                echo "LEDGERLY_API_BASE_URL must be an HTTP(S) origin when set" >&2
                exit 1
                ;;
            esac
          fi

      - name: Build web
        working-directory: apps/client
        run: |
          defines=("--dart-define=LEDGERLY_API_REQUIRE_HTTPS=${LEDGERLY_API_REQUIRE_HTTPS:-true}")
          if [[ -n "${LEDGERLY_API_BASE_URL:-}" ]]; then
            defines+=("--dart-define=LEDGERLY_API_BASE_URL=$LEDGERLY_API_BASE_URL")
          fi
          flutter build web --release "${defines[@]}"
          cd build
          zip -r ../../../ledgerly-web.zip web

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required repository secret: $variable" >&2
              exit 1
            fi
          done

          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/client/android/ledgerly-release.jks
          {
            printf 'storeFile=ledgerly-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > apps/client/android/key.properties

      - name: Build Android APK
        working-directory: apps/client
        run: |
          defines=("--dart-define=LEDGERLY_API_REQUIRE_HTTPS=${LEDGERLY_API_REQUIRE_HTTPS:-true}")
          if [[ -n "${LEDGERLY_API_BASE_URL:-}" ]]; then
            defines+=("--dart-define=LEDGERLY_API_BASE_URL=$LEDGERLY_API_BASE_URL")
          fi
          flutter build apk --release --split-per-abi "${defines[@]}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../../ledgerly-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../../ledgerly-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk ../../ledgerly-android-x86_64.apk

      - name: Verify client artifacts
        run: |
          for archive in \
            ledgerly-web.zip \
            ledgerly-android-arm64-v8a.apk \
            ledgerly-android-armeabi-v7a.apk \
            ledgerly-android-x86_64.apk; do
            test -s "$archive"
            unzip -tq "$archive"
          done

      - name: Verify Android release signing
        run: |
          scripts/verify_android_release_signing.sh \
            apps/client/android/release-signing-certificate.sha256 \
            ledgerly-android-arm64-v8a.apk \
            ledgerly-android-armeabi-v7a.apk \
            ledgerly-android-x86_64.apk

      - name: Remove Android signing material
        if: always()
        run: |
          rm -f \
            apps/client/android/key.properties \
            apps/client/android/ledgerly-release.jks

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: client-packages
          if-no-files-found: error
          path: |
            ledgerly-web.zip
            ledgerly-android-arm64-v8a.apk
            ledgerly-android-armeabi-v7a.apk
            ledgerly-android-x86_64.apk

  server-image:
    name: Build & push server image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,prefix=sha-

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Publish GitHub Release
    needs: [client-release, server-image]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: client-packages

      - name: Create release notes
        run: |
          cat > /tmp/notes.md <<EOF
          ## Ledgerly ${{ github.ref_name }}

          ### Client (this release)
          - Collapse AI insight cards by default so the feed stays scannable; expand to configure or regenerate.
          - Search the selected month by note, category, account, or amount, expanding matching days.
          - Optional PIN app lock after a cold start or when returning from the background.
          - Local budgets, monthly recurring rules, CSV import/export, and on-device attachments that never enter sync JSON.
          - Localize the client UI with Chinese as the default and fallback; English when the system language is English.
          - Show daily spend insights inside today's feed group. Monthly insights live on the reports page, with a feed shortcut to open them.
          - Generate daily and previous-month spend insights with a user-provided DeepSeek or OpenCode key. Ledger slices stay on-device and never go through Ledgerly's server.
          - Configure provider, API key, base URL, and model in Settings. Insights are cached locally and are not synced.
          - OpenCode uses \`https://opencode.ai/zen/go/v1\`. Flutter Web cannot call that gateway due to CORS; use the Android app.
          - Choose any transaction date when creating or editing expense, income, and transfer entries, making forgotten entries easy to backfill.
          - Preserve business dates across local storage and device sync, with monthly lists and reports following local calendar boundaries.
          - API service is optional; without one Ledgerly stays local-only and makes no authentication or sync requests.
          - Configure or clear the API service from login, recovery, or Settings.
          - Native clients may opt into a public HTTP API with \`LEDGERLY_API_REQUIRE_HTTPS=false\`; Web clients continue to require HTTPS for secure cookies.
          - Tap an existing ledger entry to edit its amount, account, category, or note while preserving its transaction identity.
          - Added two-level default categories with a category management and editing page.
          - Refreshed the main Ledgerly experience with responsive feed, accounts, reports, and settings pages.
          - Added expense, income, and transfer quick entry with category/account pickers and a numeric keypad.
          - \`ledgerly-web.zip\` — Flutter Web
          - \`ledgerly-android-arm64-v8a.apk\` — Android release APK for most modern phones
          - \`ledgerly-android-armeabi-v7a.apk\` — Android release APK for older 32-bit ARM devices
          - \`ledgerly-android-x86_64.apk\` — Android release APK for x86_64 devices and emulators
          - Android certificate SHA-256: \`91:C0:AF:AF:04:68:AC:F8:5C:63:8E:6A:A6:5C:7D:02:2D:9D:24:9A:F8:87:11:CB:B7:46:70:24:BB:D4:B6:0B\`
          - APKs published before release signing was introduced use a different certificate and must be uninstalled before installing this release.

          ### Server
          - Persist transaction business dates in PostgreSQL and use them for reports and budget progress, with compatible backfill for existing data and older clients.
          Docker image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}\`
          Also tagged \`latest\` when this is a version tag.

          Deploy with host Postgres (no bundled PG):
          \`\`\`bash
          docker compose -f infrastructure/docker/docker-compose.prod.yml --env-file .env.prod pull
          docker compose -f infrastructure/docker/docker-compose.prod.yml --env-file .env.prod up -d
          \`\`\`
          EOF

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ledgerly-web.zip
            ledgerly-android-arm64-v8a.apk
            ledgerly-android-armeabi-v7a.apk
            ledgerly-android-x86_64.apk
          body_path: /tmp/notes.md
          generate_release_notes: true
