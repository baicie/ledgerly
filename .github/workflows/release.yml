name: Release

# Tag push: v0.1.0 → GitHub Release (clients) + GHCR image + optional SSH deploy
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0); empty = current SHA"
        required: false
      deploy:
        description: "Deploy server image to production host"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ledgerly-server

jobs:
  client-release:
    name: Package Flutter clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve workspace
        run: dart pub get

      - name: Build web
        working-directory: apps/client
        run: |
          flutter build web --release
          cd build
          zip -r ../../ledgerly-web.zip web

      - name: Build Android APK
        working-directory: apps/client
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../ledgerly-android.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-packages
          path: |
            ledgerly-web.zip
            ledgerly-android.apk

  server-image:
    name: Build & push server image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,prefix=sha-

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Publish GitHub Release
    needs: [client-release, server-image]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: client-packages

      - name: Create release notes
        run: |
          cat > /tmp/notes.md <<EOF
          ## Ledgerly ${{ github.ref_name }}

          ### Client (this release)
          - \`ledgerly-web.zip\` — Flutter Web
          - \`ledgerly-android.apk\` — Android release APK

          ### Server
          Docker image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}\`
          Also tagged \`latest\` when this is a version tag.

          Deploy with host Postgres (no bundled PG):
          \`\`\`bash
          docker compose -f infrastructure/docker/docker-compose.prod.yml --env-file .env.prod pull
          docker compose -f infrastructure/docker/docker-compose.prod.yml --env-file .env.prod up -d
          \`\`\`
          EOF

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ledgerly-web.zip
            ledgerly-android.apk
          body_path: /tmp/notes.md
          generate_release_notes: true

  deploy:
    name: Deploy server to host
    needs: [server-image]
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$KEY" || {
            echo "Set DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY repository secrets"
            exit 1
          }

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: |
            set -euo pipefail
            DIR=${DEPLOY_DIR:-/opt/ledgerly}
            mkdir -p "$DIR"
            cd "$DIR"
            test -f .env.prod || { echo "missing $DIR/.env.prod"; exit 1; }
            # pull compose file from image is awkward; keep a copy on host or curl raw from repo
            if [ ! -f docker-compose.prod.yml ]; then
              curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/infrastructure/docker/docker-compose.prod.yml" \
                -o docker-compose.prod.yml
            fi
            echo "${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag || format('sha-{0}', github.sha) }}"
            export LEDGER_IMAGE="$IMAGE"
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps
            curl -sf "http://127.0.0.1:${LEDGER_PORT:-8080}/health/ready" || curl -sf http://127.0.0.1:8080/health/ready
