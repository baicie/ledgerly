name: Release

# Tag push: v* → GitHub Release (clients) + GHCR image + optional SSH deploy
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0); empty = current SHA"
        required: false
      deploy:
        description: "Deploy server image to production host"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ledgerly-server

jobs:
  client-release:
    name: Package Flutter clients
    runs-on: ubuntu-latest
    env:
      LEDGERLY_API_BASE_URL: ${{ vars.LEDGERLY_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve workspace
        run: dart pub get

      - name: Validate optional client API endpoint
        run: |
          if [[ -n "${LEDGERLY_API_BASE_URL:-}" && "$LEDGERLY_API_BASE_URL" != https://* ]]; then
            echo "LEDGERLY_API_BASE_URL must be an HTTPS origin when set" >&2
            exit 1
          fi

      - name: Build web
        working-directory: apps/client
        run: |
          defines=()
          if [[ -n "${LEDGERLY_API_BASE_URL:-}" ]]; then
            defines+=("--dart-define=LEDGERLY_API_BASE_URL=$LEDGERLY_API_BASE_URL")
          fi
          flutter build web --release "${defines[@]}"
          cd build
          zip -r ../../../ledgerly-web.zip web

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required repository secret: $variable" >&2
              exit 1
            fi
          done

          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/client/android/ledgerly-release.jks
          {
            printf 'storeFile=ledgerly-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > apps/client/android/key.properties

      - name: Build Android APK
        working-directory: apps/client
        run: |
          defines=()
          if [[ -n "${LEDGERLY_API_BASE_URL:-}" ]]; then
            defines+=("--dart-define=LEDGERLY_API_BASE_URL=$LEDGERLY_API_BASE_URL")
          fi
          flutter build apk --release --split-per-abi "${defines[@]}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../../ledgerly-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../../ledgerly-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk ../../ledgerly-android-x86_64.apk

      - name: Verify client artifacts
        run: |
          for archive in \
            ledgerly-web.zip \
            ledgerly-android-arm64-v8a.apk \
            ledgerly-android-armeabi-v7a.apk \
            ledgerly-android-x86_64.apk; do
            test -s "$archive"
            unzip -tq "$archive"
          done

      - name: Verify Android release signing
        run: |
          scripts/verify_android_release_signing.sh \
            apps/client/android/release-signing-certificate.sha256 \
            ledgerly-android-arm64-v8a.apk \
            ledgerly-android-armeabi-v7a.apk \
            ledgerly-android-x86_64.apk

      - name: Remove Android signing material
        if: always()
        run: |
          rm -f \
            apps/client/android/key.properties \
            apps/client/android/ledgerly-release.jks

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-packages
          if-no-files-found: error
          path: |
            ledgerly-web.zip
            ledgerly-android-arm64-v8a.apk
            ledgerly-android-armeabi-v7a.apk
            ledgerly-android-x86_64.apk

  server-image:
    name: Build & push server image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,prefix=sha-

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Publish GitHub Release
    needs: [client-release, server-image]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: client-packages

      - name: Create release notes
        run: |
          cat > /tmp/notes.md <<EOF
          ## Ledgerly ${{ github.ref_name }}

          ### Client (this release)
          - API service is optional; without one Ledgerly stays local-only and makes no authentication or sync requests.
          - Configure or clear the API service from login, recovery, or Settings.
          - \`ledgerly-web.zip\` — Flutter Web
          - \`ledgerly-android-arm64-v8a.apk\` — Android release APK for most modern phones
          - \`ledgerly-android-armeabi-v7a.apk\` — Android release APK for older 32-bit ARM devices
          - \`ledgerly-android-x86_64.apk\` — Android release APK for x86_64 devices and emulators
          - Android certificate SHA-256: \`91:C0:AF:AF:04:68:AC:F8:5C:63:8E:6A:A6:5C:7D:02:2D:9D:24:9A:F8:87:11:CB:B7:46:70:24:BB:D4:B6:0B\`
          - APKs published before release signing was introduced use a different certificate and must be uninstalled before installing this release.

          ### Server
          Docker image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}\`
          Also tagged \`latest\` when this is a version tag.

          Deploy with host Postgres (no bundled PG):
          \`\`\`bash
          docker compose -f infrastructure/docker/docker-compose.prod.yml --env-file .env.prod pull
          docker compose -f infrastructure/docker/docker-compose.prod.yml --env-file .env.prod up -d
          \`\`\`
          EOF

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ledgerly-web.zip
            ledgerly-android-arm64-v8a.apk
            ledgerly-android-armeabi-v7a.apk
            ledgerly-android-x86_64.apk
          body_path: /tmp/notes.md
          generate_release_notes: true

  deploy:
    name: Deploy server to host
    needs: [server-image]
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$KEY" || {
            echo "Set DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY repository secrets"
            exit 1
          }

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: |
            set -euo pipefail
            DIR=${DEPLOY_DIR:-/opt/ledgerly}
            mkdir -p "$DIR"
            cd "$DIR"
            test -f .env.prod || { echo "missing $DIR/.env.prod"; exit 1; }
            # pull compose file from image is awkward; keep a copy on host or curl raw from repo
            if [ ! -f docker-compose.prod.yml ]; then
              curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/infrastructure/docker/docker-compose.prod.yml" \
                -o docker-compose.prod.yml
            fi
            echo "${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag || format('sha-{0}', github.sha) }}"
            export LEDGER_IMAGE="$IMAGE"
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps
            curl -sf "http://127.0.0.1:${LEDGER_PORT:-8080}/health/ready" || curl -sf http://127.0.0.1:8080/health/ready
