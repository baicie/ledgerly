name: Deploy Ledgerly Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "infrastructure/docker/docker-compose.prod.yml"
      - "infrastructure/docker/docker-compose.vm.yml"
      - "infrastructure/docker/env.prod.example"
      - "infrastructure/docker/env.vm.example"
      - "scripts/deploy_vm_release.sh"
      - "scripts/tests/deploy_vm_release_test.sh"
      - "scripts/tests/server_image_smoke_test.sh"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing GHCR tag to deploy; leave empty to build this ref"
        required: false
        type: string

concurrency:
  group: ledgerly-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ledgerly-server

jobs:
  verify:
    name: Verify server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://ledgerly:ledgerly@127.0.0.1:5432/ledgerly
      JWT_SECRET: ci-only-ledgerly-secret
      REQUIRE_POSTGRES_TESTS: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledgerly
          POSTGRES_PASSWORD: ledgerly
          POSTGRES_DB: ledgerly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerly -d ledgerly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Test deployment runtime
        run: ../scripts/tests/deploy_vm_release_test.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test with PostgreSQL
        run: cargo test --workspace

  build:
    name: Build and push image
    needs: verify
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production
    needs: [verify, build]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Require deployment secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$KEY" && test -n "$FINGERPRINT" || {
            echo "Set DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, and DEPLOY_HOST_FINGERPRINT"
            exit 1
          }

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify deployment image
        id: image
        env:
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -n "$REQUESTED_IMAGE_TAG" ]]; then
            [[ "$REQUESTED_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
              echo "Invalid image tag: $REQUESTED_IMAGE_TAG" >&2
              exit 1
            }
            SOURCE_IMAGE="${REGISTRY}/${IMAGE_NAME}:${REQUESTED_IMAGE_TAG}"
          else
            test -n "$BUILD_DIGEST"
            SOURCE_IMAGE="${REGISTRY}/${IMAGE_NAME}@${BUILD_DIGEST}"
          fi

          LOCAL_IMAGE="ledgerly-server:deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker pull --platform linux/amd64 "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$LOCAL_IMAGE"
          scripts/tests/server_image_smoke_test.sh "$LOCAL_IMAGE"
          echo "local=$LOCAL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Package runtime files
        run: |
          bash -n scripts/deploy_vm_release.sh
          scripts/tests/deploy_vm_release_test.sh
          mkdir -p deploy
          cp infrastructure/docker/docker-compose.prod.yml deploy/
          cp infrastructure/docker/docker-compose.vm.yml deploy/
          cp scripts/deploy_vm_release.sh deploy/

      - name: Sync, deploy, and verify on VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          SOURCE_IMAGE: ${{ steps.image.outputs.source }}
          EXPECTED_IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          SSH_DIR="$RUNNER_TEMP/ledgerly-deploy-ssh"
          KEY_FILE="$SSH_DIR/id_ed25519"
          KNOWN_HOSTS="$SSH_DIR/known_hosts"
          REMOTE_RELEASE="/opt/ledgerly/runtime-releases/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 700 "$SSH_DIR"
          trap 'rm -rf "$SSH_DIR"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          [[ "$DEPLOY_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]

          SSH_OPTS=(
            -i "$KEY_FILE"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o ConnectionAttempts=1
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS"
          )
          SCP_OPTS=(
            -i "$KEY_FILE"
            -P "$DEPLOY_PORT"
            -o BatchMode=yes
            -o ConnectionAttempts=1
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS"
          )

          HOST_KEYS=""
          for attempt in 1 2 3 4 5; do
            HOST_KEYS=$(ssh-keyscan -T 15 -p "$DEPLOY_PORT" "$DEPLOY_HOST" 2>/dev/null || true)
            MATCHED_KEYS=""
            while IFS= read -r host_key; do
              key_fingerprint=$(printf '%s\n' "$host_key" | \
                ssh-keygen -lf - -E sha256 2>/dev/null | awk '{print $2}')
              if [[ "$key_fingerprint" == "$DEPLOY_FINGERPRINT" ]]; then
                MATCHED_KEYS+="$host_key"$'\n'
              fi
            done <<< "$HOST_KEYS"
            if [[ -n "$MATCHED_KEYS" ]]; then
              printf '%s' "$MATCHED_KEYS" > "$KNOWN_HOSTS"
              break
            fi
            test "$attempt" -lt 5
            sleep $((attempt * 3))
          done
          test -s "$KNOWN_HOSTS"

          for attempt in 1 2 3 4 5; do
            if ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "install -d -m 700 '$REMOTE_RELEASE'"; then
              break
            fi
            test "$attempt" -lt 5
            sleep $((attempt * 5))
          done

          for attempt in 1 2 3 4 5; do
            if scp "${SCP_OPTS[@]}" \
              deploy/docker-compose.prod.yml deploy/docker-compose.vm.yml deploy/deploy_vm_release.sh \
              "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_RELEASE/"; then
              set +e
              ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                "exec bash '$REMOTE_RELEASE/deploy_vm_release.sh' activate '$REMOTE_RELEASE' /opt/ledgerly"
              activate_status=$?
              set -e
              if [[ "$activate_status" -eq 0 ]]; then
                break
              fi
              if [[ "$activate_status" -ne 255 ]]; then
                exit "$activate_status"
              fi
            fi
            test "$attempt" -lt 5
            sleep $((attempt * 5))
          done

          for attempt in 1 2 3 4 5; do
            set +e
            printf '%s\n' \
              "$GHCR_TOKEN" "$GHCR_USERNAME" "$SOURCE_IMAGE" "$EXPECTED_IMAGE_PREFIX" | \
              ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                "exec bash '$REMOTE_RELEASE/deploy_vm_release.sh' deploy /opt/ledgerly"
            deploy_status=${PIPESTATUS[1]}
            set -e
            if [[ "$deploy_status" -eq 0 ]]; then
              break
            fi
            if [[ "$deploy_status" -ne 255 ]]; then
              exit "$deploy_status"
            fi
            test "$attempt" -lt 5
            sleep $((attempt * 10))
          done
